name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Embed release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $path = "updater.py"
          $contents = Get-Content $path -Raw
          $contents = $contents -replace '__version__ = .*', "__version__ = `\"$version`\""
          Set-Content $path $contents -Encoding utf8

      - name: Build executable
        run: |
          pyinstaller --onefile --clean --name Better-Schology `
            --collect-all lxml `
            --hidden-import updater `
            --add-data "HTML;HTML" `
            --add-data "libreoffice;libreoffice" `
            --add-binary "update.exe;." `
            server.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Better-Schology.exe
          generate_release_notes: true